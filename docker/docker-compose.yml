services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: lambda-events-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: root
      POSTGRES_DB: app
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-scripts:/docker-entrypoint-initdb.d

volumes:
  postgres_data:
