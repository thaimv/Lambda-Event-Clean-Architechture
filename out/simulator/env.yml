local:
  # Runtime
  NODE_ENV: local
  LOG_LEVEL: debug
  AWS_REGION: ap-northeast-1
  AWS_ACCESS_KEY_ID: 'your-access-key-id'
  AWS_SECRET_ACCESS_KEY: 'your-secret-access-key'

  # Database (delete-user) — local: DATABASE_URL; AWS dev+: RDS_SECRET_ARN + RDS_PROXY_ENDPOINT
  DATABASE_URL: 'postgresql://user:root@localhost:5433/app?schema=public'
  DATABASE_URL_REPLICA: 'postgresql://user:root@localhost:5433/app?schema=public'
  RDS_PROXY_ENDPOINT: 'your-proxy.proxy-us-east-1.rds.amazonaws.com'
  RDS_PROXY_ENDPOINT_REPLICA: 'your-proxy-replica.proxy-us-east-1.rds.amazonaws.com'
  RDS_SECRET_ARN: 'arn:aws:secretsmanager:us-east-1:194130476852:secret:rds-credentials-xxxx'
  DELETE_USER_SOFT_DELETE_RETENTION_YEARS: 1

  # JWT authorizer (Cognito User Pool + Valkey cache)
  COGNITO_USER_POOL_ID: 'us-east-1_test'
  COGNITO_USER_POOL_CLIENT_ID: 'test-client-id'
  COGNITO_USER_POOL_REGION: 'us-east-1'
  ELASTICACHE_HOST: 'localhost'
  ELASTICACHE_PORT: 6379
  ELASTICACHE_TTL: 86400
  ELASTICACHE_SLIDING_EXPIRATION: 'true'
  ELASTICACHE_USE_TLS: 'true'
  ELASTICACHE_CLUSTER_MODE: 'false'
  ELASTICACHE_REQUEST_TIMEOUT_MS: 15000
  ELASTICACHE_CONNECTION_TIMEOUT_MS: 15000

  # Get identity token (Cognito)
  COGNITO_IDENTITY_POOL_ID: 'ap-northeast-1:00000000-0000-0000-0000-000000000000'
  TOKEN_DURATION_SECONDS: 86400
